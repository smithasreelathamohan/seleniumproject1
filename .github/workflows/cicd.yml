on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven



      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser


      - name: Build and test
        env:
          CHROME_OPTS: "--headless --no-sandbox --disable-dev-shm-usage"
        run: |
          echo "Kör alla tester, selenium och unittester..."
          mvn -B clean test -Dwebdriver.chrome.driver=/usr/bin/chromedriver